name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=#0891b2&color_dots=#ebedf0,#a5f3fc,#67e8f9,#22d3ee,#0891b2
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#164e63,#0e7490,#0891b2,#22d3ee
      - name: Commit generated snake
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git commit -m "Render contribution snake"; then
            git push
          fi

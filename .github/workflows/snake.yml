name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=#8a2f75&color_dots=#f4eef5,#e4c5df,#c985bb,#9a3f84,#692455
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#d58bc9&color_dots=#0d0812,#28102d,#4a123b,#7e1f62,#ba4aa7
      - name: Commit generated snake
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git commit -m "Render contribution snake"; then
            git push
          fi

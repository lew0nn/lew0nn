<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">lew0nn signal control room</title>
  <desc id="desc">A detailed animated audio workstation with three signal displays, violet and blue hardware, and a seated operator silhouette.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1c0b36"/>
      <stop offset=".52" stop-color="#10163a"/>
      <stop offset="1" stop-color="#08152f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="44%" r="50%">
      <stop stop-color="#7135d1" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#334fe0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#060817" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#241044"/>
      <stop offset="1" stop-color="#0a1638"/>
    </linearGradient>
    <linearGradient id="screenGlass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset=".34" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".72" stop-color="#6b5cff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".055"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7446df"/>
      <stop offset=".48" stop-color="#d5dcff"/>
      <stop offset=".78" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#3f6cff"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7843dc"/>
      <stop offset="1" stop-color="#315ee6"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#17123b"/>
      <stop offset=".5" stop-color="#090b22"/>
      <stop offset="1" stop-color="#050717"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0c1935"/>
      <stop offset="1" stop-color="#050b1c"/>
    </linearGradient>
    <pattern id="grid" width="52" height="24" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V24" fill="none" stroke="#5c48bd" stroke-opacity=".2"/>
    </pattern>
    <pattern id="fineGrid" width="20" height="16" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V16" fill="none" stroke="#9b8cff" stroke-opacity=".055"/>
    </pattern>
    <pattern id="perforation" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.2" fill="#8797ff" opacity=".18"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tightGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="panelShadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#02030b" flood-opacity=".68"/>
    </filter>
    <clipPath id="mainScreen"><rect x="321" y="62" width="558" height="184" rx="16"/></clipPath>
    <clipPath id="leftScreen"><rect x="88" y="115" width="213" height="110" rx="12"/></clipPath>
    <clipPath id="rightScreen"><rect x="899" y="115" width="213" height="110" rx="12"/></clipPath>
  </defs>

  <style>
    .trace { stroke-dasharray: 20 8; animation: trace 5s linear infinite; }
    .micro-trace { stroke-dasharray: 8 5; animation: microTrace 7s linear infinite; }
    .scan { animation: scan 4.8s ease-in-out infinite; }
    .blink-a { animation: blink 2.6s ease-in-out infinite; }
    .blink-b { animation: blink 3.2s 1.1s ease-in-out infinite; }
    .blink-c { animation: blink 2.1s .6s ease-in-out infinite; }
    @keyframes trace { to { stroke-dashoffset: -112; } }
    @keyframes microTrace { to { stroke-dashoffset: 78; } }
    @keyframes scan { 0%,100% { transform: translateY(-62px); opacity: 0; } 18%,82% { opacity: .25; } 50% { transform: translateY(182px); } }
    @keyframes blink { 0%,100% { opacity: .38; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#halo)"/>

  <!-- architectural background -->
  <path d="M0 60H1200M0 91H1200M0 272H1200" stroke="#7862d8" stroke-opacity=".08"/>
  <path d="M62 0V286M162 0V286M1040 0V286M1138 0V286" stroke="#785be3" stroke-opacity=".07"/>
  <path d="M18 42H277M923 42H1182" stroke="#9a6aff" stroke-opacity=".18" stroke-width="2"/>
  <g fill="#9b8cff" opacity=".24">
    <circle cx="32" cy="58" r="2"/><circle cx="1168" cy="58" r="2"/>
    <circle cx="32" cy="270" r="2"/><circle cx="1168" cy="270" r="2"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="7.5" letter-spacing="1.8" fill="#8071a3" opacity=".64">
    <text x="26" y="29">LEW0NN / AUDIO SYSTEMS</text>
    <text x="1174" y="29" text-anchor="end">DSP ROOM / 01</text>
  </g>

  <!-- floor and perspective -->
  <path d="M0 286H1200V360H0Z" fill="#060817"/>
  <path d="M84 360L395 278H805L1116 360" fill="url(#grid)"/>
  <path d="M600 279L600 360M487 279L418 360M713 279L782 360M395 279L250 360M805 279L950 360" stroke="#5570df" stroke-opacity=".1"/>
  <path d="M86 340H1114M165 320H1035M267 300H933" stroke="#7457d7" stroke-opacity=".085"/>

  <!-- left input scope -->
  <g>
    <rect x="71" y="99" width="246" height="142" rx="20" fill="url(#bezel)" stroke="#6841d0" stroke-width="3" filter="url(#panelShadow)"/>
    <rect x="80" y="106" width="228" height="126" rx="14" fill="none" stroke="#32347e" stroke-width="1" opacity=".8"/>
    <rect x="88" y="115" width="213" height="110" rx="12" fill="url(#screen)"/>
    <g clip-path="url(#leftScreen)">
      <rect x="88" y="115" width="213" height="110" fill="url(#fineGrid)"/>
      <path d="M96 178H293" stroke="#5d57b7" stroke-opacity=".28"/>
      <path d="M108 184C126 184 129 164 146 164S165 198 182 198S200 171 217 171S232 186 252 186H281" fill="none" stroke="#241850" stroke-width="10" stroke-linecap="round" opacity=".65"/>
      <path class="micro-trace" d="M108 184C126 184 129 164 146 164S165 198 182 198S200 171 217 171S232 186 252 186H281" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round" opacity=".46" filter="url(#softGlow)"/>
      <path class="micro-trace" d="M108 184C126 184 129 164 146 164S165 198 182 198S200 171 217 171S232 186 252 186H281" fill="none" stroke="url(#signal)" stroke-width="2.75" stroke-linecap="round"/>
      <path d="M90 116L175 116L115 225H90Z" fill="url(#screenGlass)" opacity=".38"/>
    </g>
    <rect x="110" y="132" width="72" height="5" rx="2.5" fill="#aebeff"/>
    <rect class="blink-a" x="220" y="132" width="57" height="5" rx="2.5" fill="#3f6cff"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="7.5" letter-spacing="1.4">
      <text x="109" y="151" fill="#9da9eb">INPUT / A</text>
      <text x="281" y="214" text-anchor="end" fill="#7182ca">-12  0  +12</text>
    </g>
    <circle cx="86" cy="115" r="2.5" fill="#070716" stroke="#7760d6"/>
    <circle cx="302" cy="224" r="2.5" fill="#070716" stroke="#7760d6"/>
    <circle class="blink-c" cx="286" cy="128" r="3" fill="#22d3ee" filter="url(#tightGlow)"/>
  </g>

  <!-- right output analyser -->
  <g>
    <rect x="883" y="99" width="246" height="142" rx="20" fill="url(#bezel)" stroke="#514bd2" stroke-width="3" filter="url(#panelShadow)"/>
    <rect x="892" y="106" width="228" height="126" rx="14" fill="none" stroke="#32347e" stroke-width="1" opacity=".8"/>
    <rect x="899" y="115" width="213" height="110" rx="12" fill="url(#screen)"/>
    <g clip-path="url(#rightScreen)">
      <rect x="899" y="115" width="213" height="110" fill="url(#fineGrid)"/>
      <path d="M916 203H1098M916 181H1098M916 159H1098M916 137H1098" stroke="#665cc4" stroke-opacity=".14"/>
      <g fill="#3f6cff">
        <rect x="930" y="190" width="14" height="14" rx="7" opacity=".72">
          <animate attributeName="y" values="190;172;184;190" dur="2.4s" begin="-.4s" repeatCount="indefinite"/>
          <animate attributeName="height" values="14;32;20;14" dur="2.4s" begin="-.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="958" y="162" width="14" height="42" rx="7">
          <animate attributeName="y" values="162;186;156;162" dur="2.9s" begin="-1.1s" repeatCount="indefinite"/>
          <animate attributeName="height" values="42;18;48;42" dur="2.9s" begin="-1.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="986" y="168" width="14" height="36" rx="7" opacity=".82">
          <animate attributeName="y" values="168;154;181;168" dur="2.1s" begin="-.7s" repeatCount="indefinite"/>
          <animate attributeName="height" values="36;50;23;36" dur="2.1s" begin="-.7s" repeatCount="indefinite"/>
        </rect>
        <rect x="1014" y="189" width="14" height="15" rx="7" fill="#6d55ed">
          <animate attributeName="y" values="189;175;162;189" dur="3.2s" begin="-1.8s" repeatCount="indefinite"/>
          <animate attributeName="height" values="15;29;42;15" dur="3.2s" begin="-1.8s" repeatCount="indefinite"/>
        </rect>
        <rect x="1042" y="182" width="14" height="22" rx="7" opacity=".68">
          <animate attributeName="y" values="182;194;179;182" dur="2.7s" begin="-.3s" repeatCount="indefinite"/>
          <animate attributeName="height" values="22;10;25;22" dur="2.7s" begin="-.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="1070" y="180" width="14" height="24" rx="7" opacity=".86">
          <animate attributeName="y" values="180;151;171;180" dur="3s" begin="-1.4s" repeatCount="indefinite"/>
          <animate attributeName="height" values="24;53;33;24" dur="3s" begin="-1.4s" repeatCount="indefinite"/>
        </rect>
      </g>
      <rect x="899" y="115" width="213" height="110" fill="url(#screenGlass)" opacity=".3"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="7.5" letter-spacing="1.4">
      <text x="919" y="132" fill="#9da9eb">OUTPUT / FFT</text>
      <text x="1094" y="214" text-anchor="end" fill="#7182ca">60  250  1K  4K  16K</text>
    </g>
    <circle cx="898" cy="115" r="2.5" fill="#070716" stroke="#7760d6"/>
    <circle cx="1114" cy="224" r="2.5" fill="#070716" stroke="#7760d6"/>
    <circle class="blink-b" cx="1097" cy="128" r="3" fill="#d946ef" filter="url(#tightGlow)"/>
  </g>

  <!-- central scope chassis -->
  <g filter="url(#panelShadow)">
    <rect x="298" y="35" width="604" height="236" rx="24" fill="#07091c" stroke="url(#frame)" stroke-width="4"/>
    <rect x="306" y="43" width="588" height="220" rx="19" fill="url(#bezel)" stroke="#211d58" stroke-width="2"/>
    <path d="M329 47H455" stroke="#d946ef" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
    <path d="M745 47H871" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
    <path d="M312 84V214M888 84V214" stroke="#4461d9" stroke-opacity=".34"/>
    <g fill="#050615" stroke="#6655bd" stroke-width="1">
      <circle cx="320" cy="58" r="3"/><circle cx="880" cy="58" r="3"/>
      <circle cx="320" cy="248" r="3"/><circle cx="880" cy="248" r="3"/>
    </g>
    <rect x="319" y="60" width="562" height="188" rx="18" fill="url(#screen)" stroke="#3d3d9a" stroke-width="2"/>
  </g>

  <!-- central scope content -->
  <g clip-path="url(#mainScreen)">
    <rect x="321" y="62" width="558" height="184" fill="url(#fineGrid)"/>
    <path d="M321 102H879M321 146H879M321 190H879M400 62V246M480 62V246M560 62V246M640 62V246M720 62V246M800 62V246" stroke="#5c48bd" stroke-opacity=".16"/>
    <rect class="scan" x="321" y="62" width="558" height="48" fill="#3f6cff" opacity=".16"/>
    <path d="M342 170C362 170 369 145 384 145S404 190 421 190S441 130 458 130S477 198 496 198S518 151 538 151S558 175 578 175S598 158 618 158S638 135 657 135S677 190 696 190S716 145 736 145S755 170 775 170H858" fill="none" stroke="#21164a" stroke-width="13" stroke-linecap="round" opacity=".6"/>
    <path class="trace" pathLength="100" d="M342 170C362 170 369 145 384 145S404 190 421 190S441 130 458 130S477 198 496 198S518 151 538 151S558 175 578 175S598 158 618 158S638 135 657 135S677 190 696 190S716 145 736 145S755 170 775 170H858" fill="none" stroke="url(#signal)" stroke-width="6" stroke-linecap="round" opacity=".46" filter="url(#softGlow)"/>
    <path class="trace" pathLength="100" d="M342 170C362 170 369 145 384 145S404 190 421 190S441 130 458 130S477 198 496 198S518 151 538 151S558 175 578 175S598 158 618 158S638 135 657 135S677 190 696 190S716 145 736 145S755 170 775 170H858" fill="none" stroke="url(#signal)" stroke-width="2.75" stroke-linecap="round"/>
    <path d="M342 218H486" stroke="#d946ef" stroke-width="2" stroke-linecap="round" opacity=".62"/>
    <path d="M714 218H858" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity=".68"/>
    <path d="M321 62L450 62L348 246H321Z" fill="url(#screenGlass)" opacity=".25"/>
  </g>

  <!-- central readouts -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="348" y="88" fill="#b9c5ff" font-size="11" letter-spacing="2.4">SIGNAL / CONTROL</text>
    <text x="852" y="88" text-anchor="end" fill="#d5dcff" font-size="11">48 kHz</text>
    <text x="348" y="111" fill="#746db1" font-size="7.5" letter-spacing="1.6">CH 01 / LIVE INPUT</text>
    <text x="824" y="111" text-anchor="end" fill="#746db1" font-size="7.5" letter-spacing="1.6">SYNC / LOCKED</text>
    <text x="348" y="239" fill="#6976bb" font-size="7">-24</text>
    <text x="852" y="239" text-anchor="end" fill="#6976bb" font-size="7">+6 dB</text>
  </g>
  <circle class="blink-a" cx="840" cy="108" r="3" fill="#22d3ee" filter="url(#tightGlow)"/>
  <circle class="blink-b" cx="852" cy="108" r="3" fill="#f59e0b"/>

  <!-- monitor neck and control deck -->
  <path d="M566 271H634L650 291H550Z" fill="#080b1c" stroke="#5c48bd" stroke-width="2" stroke-linejoin="round"/>
  <path d="M574 273H626L632 281H568Z" fill="#223269" opacity=".52"/>
  <rect x="190" y="276" width="820" height="48" rx="24" fill="url(#deck)" stroke="#3659d8" stroke-width="3"/>
  <rect x="202" y="284" width="796" height="31" rx="15.5" fill="none" stroke="#3c3c87" stroke-width="1" opacity=".68"/>
  <path d="M234 300H242M958 300H966" stroke="#203060" stroke-width="1" stroke-linecap="round"/>

  <!-- deck controls -->
  <rect x="248" y="289" width="174" height="20" rx="6" fill="#070d20" stroke="#303872"/>
  <rect x="260" y="295" width="150" height="8" rx="4" fill="#3d3d9a"/>
  <rect class="blink-a" x="432" y="288" width="24" height="11" rx="4" fill="#22d3ee"/>
  <rect x="778" y="289" width="174" height="20" rx="6" fill="#070d20" stroke="#303872"/>
  <rect x="790" y="295" width="150" height="8" rx="4" fill="#3d3d9a"/>
  <rect class="blink-b" x="744" y="288" width="24" height="11" rx="4" fill="#d946ef"/>
  <g fill="#151a3c" stroke="#5455aa" stroke-width=".8">
    <rect x="460" y="288" width="14" height="11" rx="3"/><rect x="477" y="288" width="14" height="11" rx="3"/>
    <rect x="494" y="288" width="14" height="11" rx="3"/><rect x="692" y="288" width="14" height="11" rx="3"/>
    <rect x="709" y="288" width="14" height="11" rx="3"/><rect x="726" y="288" width="14" height="11" rx="3"/>
  </g>
  <g fill="#7466da">
    <circle cx="467" cy="305" r="2"/><circle class="blink-c" cx="484" cy="305" r="2" fill="#22d3ee"/>
    <circle cx="501" cy="305" r="2" fill="#f59e0b"/><circle cx="699" cy="305" r="2" fill="#f59e0b"/>
    <circle class="blink-b" cx="716" cy="305" r="2" fill="#d946ef"/><circle cx="733" cy="305" r="2"/>
  </g>
  <rect x="214" y="291" width="20" height="18" rx="4" fill="url(#perforation)"/>
  <rect x="966" y="291" width="20" height="18" rx="4" fill="url(#perforation)"/>

  <!-- operator silhouette -->
  <ellipse cx="600" cy="301" rx="88" ry="24" fill="#05030a" opacity=".94"/>
  <circle cx="600" cy="260" r="38" fill="#050711" stroke="#28286b" stroke-width="3"/>
  <path d="M574 249C580 236 589 229 600 229S620 236 626 249" fill="none" stroke="#6654bc" stroke-opacity=".28" stroke-width="2"/>
  <path d="M510 350C516 304 548 282 600 282S684 304 690 350Z" fill="#050711" stroke="#28286b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M522 340C536 304 562 291 600 291S664 304 678 340" fill="none" stroke="#4a3e93" stroke-opacity=".34" stroke-width="2"/>
  <path d="M600 296V338" stroke="#3f5bd4" stroke-width="2" stroke-linecap="round" opacity=".78"/>
  <path d="M541 325L518 343M659 325L682 343" stroke="#172450" stroke-width="4" stroke-linecap="round"/>

  <!-- outer trim -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="16.5" fill="none" stroke="url(#frame)" stroke-width="3"/>
  <path d="M22 2H245M955 2H1178M22 358H245M955 358H1178" stroke="#8c63ef" stroke-width="2" stroke-linecap="round" opacity=".75"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">lew0nn audio console</title>
  <desc id="desc">An animated dark audio workstation with violet signal displays, magenta harmonics, cyan meters, and restrained amber status lights.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#15101d"/>
      <stop offset="0.55" stop-color="#0b0911"/>
      <stop offset="1" stop-color="#050408"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1b1524"/>
      <stop offset="1" stop-color="#0c0911"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#120d1b"/>
      <stop offset="1" stop-color="#08070d"/>
    </linearGradient>
    <linearGradient id="violetEdge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5b2aa8"/>
      <stop offset="0.48" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6030b5"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b5cf6"/>
      <stop offset="0.45" stop-color="#e879f9"/>
      <stop offset="0.76" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="62%">
      <stop stop-color="#f0abfc"/>
      <stop offset="0.24" stop-color="#a855f7"/>
      <stop offset="0.58" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#09070e"/>
    </radialGradient>
    <radialGradient id="violetAura" cx="50%" cy="42%" r="58%">
      <stop stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microGrid" width="32" height="24" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V24" fill="none" stroke="#a78bfa" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <pattern id="perforation" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.25" fill="#c4b5fd" opacity="0.18"/>
    </pattern>
    <clipPath id="scopeClip"><path d="M301 76H899L914 91V225L899 240H301L286 225V91Z"/></clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .signal-run { stroke-dasharray: 28 10; animation: signalRun 5.5s linear infinite; }
    .scan { animation: scan 5.2s ease-in-out infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: 600px 268px; }
    .meter-a { animation: meterA 2.4s ease-in-out infinite; }
    .meter-b { animation: meterB 2.9s .35s ease-in-out infinite; }
    .status { animation: status 2.2s ease-in-out infinite; }
    @keyframes signalRun { to { stroke-dashoffset: -152; } }
    @keyframes scan { 0%,100% { transform: translateX(-72px); opacity: 0; } 18%,82% { opacity: .18; } 50% { transform: translateX(640px); } }
    @keyframes pulse { 0%,100% { transform: scale(.94); opacity: .78; } 50% { transform: scale(1.06); opacity: 1; } }
    @keyframes meterA { 0%,100% { opacity: .48; } 45% { opacity: 1; } }
    @keyframes meterB { 0%,100% { opacity: 1; } 55% { opacity: .4; } }
    @keyframes status { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="360" rx="20" fill="url(#shell)"/>
  <rect width="1200" height="360" rx="20" fill="url(#violetAura)"/>
  <path d="M20 40H1180M20 320H1180" stroke="#6d28d9" stroke-opacity="0.24"/>
  <path d="M60 0L0 60M1140 0L1200 60M60 360L0 300M1140 360L1200 300" stroke="#a855f7" stroke-opacity="0.16"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="42" y="27" fill="#ddd6fe" font-size="12" font-weight="700" letter-spacing="2.8">LEW0NN</text>
    <text x="127" y="27" fill="#8b7ba4" font-size="10" letter-spacing="1.8">AUDIO / DSP</text>
    <circle cx="1058" cy="23" r="4" fill="#22d3ee" filter="url(#softGlow)"/>
    <circle class="status" cx="1075" cy="23" r="4" fill="#f59e0b"/>
    <text x="1091" y="27" fill="#9d8fac" font-size="10" letter-spacing="1.8">SIGNAL LIVE</text>
  </g>

  <path d="M48 86L66 68H242L258 84V266L242 282H66L48 264Z" fill="url(#panel)" stroke="#38284a" stroke-width="2"/>
  <path d="M942 84L958 68H1134L1152 86V264L1134 282H958L942 266Z" fill="url(#panel)" stroke="#38284a" stroke-width="2"/>
  <path d="M63 100H243V249L230 264H63Z" fill="#09070e" stroke="#5b2aa8" stroke-opacity="0.55"/>
  <path d="M957 100H1137V264H970L957 249Z" fill="#09070e" stroke="#5b2aa8" stroke-opacity="0.55"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="2">
    <text x="78" y="122" fill="#9d8fac">INPUT</text>
    <text x="1122" y="122" text-anchor="end" fill="#9d8fac">OUTPUT</text>
  </g>

  <g transform="translate(80 138)">
    <circle cx="34" cy="34" r="27" fill="#0d0912" stroke="#4c3560" stroke-width="2"/>
    <circle cx="34" cy="34" r="20" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="82 44" transform="rotate(140 34 34)"/>
    <path d="M34 34L25 17" stroke="#e879f9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="105" cy="34" r="27" fill="#0d0912" stroke="#4c3560" stroke-width="2"/>
    <circle cx="105" cy="34" r="20" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="66 60" transform="rotate(140 105 34)"/>
    <path d="M105 34L118 22" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <text x="34" y="78" text-anchor="middle" fill="#766a83" font-family="ui-monospace, Consolas, monospace" font-size="8">DRIVE</text>
    <text x="105" y="78" text-anchor="middle" fill="#766a83" font-family="ui-monospace, Consolas, monospace" font-size="8">MIX</text>
  </g>
  <rect x="78" y="231" width="150" height="18" rx="4" fill="url(#perforation)"/>

  <g transform="translate(974 139)">
    <rect x="0" y="0" width="146" height="78" rx="8" fill="#0c0911" stroke="#352641"/>
    <g fill="#8b5cf6">
      <rect class="meter-a" x="13" y="34" width="10" height="31" rx="5"/>
      <rect class="meter-b" x="34" y="17" width="10" height="48" rx="5" fill="#a855f7"/>
      <rect class="meter-a" x="55" y="27" width="10" height="38" rx="5" fill="#c084fc"/>
      <rect class="meter-b" x="76" y="9" width="10" height="56" rx="5" fill="#22d3ee"/>
      <rect class="meter-a" x="97" y="23" width="10" height="42" rx="5" fill="#a855f7"/>
      <rect class="meter-b" x="118" y="38" width="10" height="27" rx="5"/>
    </g>
    <path d="M6 69H140" stroke="#4c3560"/>
  </g>
  <g fill="#22182d" stroke="#4c3560">
    <rect x="974" y="230" width="42" height="19" rx="4"/>
    <rect x="1026" y="230" width="42" height="19" rx="4"/>
    <rect x="1078" y="230" width="42" height="19" rx="4"/>
  </g>
  <circle cx="988" cy="239.5" r="3" fill="#22d3ee"/>
  <circle cx="1040" cy="239.5" r="3" fill="#a855f7"/>
  <circle cx="1092" cy="239.5" r="3" fill="#f59e0b"/>

  <path d="M292 45H908L936 73V259L909 286H291L264 259V73Z" fill="#08060c" stroke="url(#violetEdge)" stroke-width="3"/>
  <path d="M304 57H896L923 84V248L897 274H303L277 248V84Z" fill="url(#panel)" stroke="#2f223b" stroke-width="2"/>
  <path d="M301 76H899L914 91V225L899 240H301L286 225V91Z" fill="url(#screen)" stroke="#6d28d9" stroke-opacity="0.75" stroke-width="2"/>

  <g clip-path="url(#scopeClip)">
    <rect x="286" y="76" width="628" height="164" fill="url(#microGrid)"/>
    <rect class="scan" x="286" y="76" width="72" height="164" fill="#a855f7"/>
    <path d="M304 171C321 171 328 157 341 157S358 188 372 188S389 129 404 129S420 208 436 208S451 142 468 142S483 180 499 180S516 160 534 160S551 171 568 171S585 153 602 153S619 184 636 184S653 116 671 116S689 204 706 204S723 146 741 146S759 171 777 171S795 155 813 155S830 171 850 171H897" fill="none" stroke="#3b244b" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
    <path d="M304 171C321 171 328 157 341 157S358 188 372 188S389 129 404 129S420 208 436 208S451 142 468 142S483 180 499 180S516 160 534 160S551 171 568 171S585 153 602 153S619 184 636 184S653 116 671 116S689 204 706 204S723 146 741 146S759 171 777 171S795 155 813 155S830 171 850 171H897" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path class="signal-run" pathLength="100" d="M304 171C321 171 328 157 341 157S358 188 372 188S389 129 404 129S420 208 436 208S451 142 468 142S483 180 499 180S516 160 534 160S551 171 568 171S585 153 602 153S619 184 636 184S653 116 671 116S689 204 706 204S723 146 741 146S759 171 777 171S795 155 813 155S830 171 850 171H897" fill="none" stroke="#f5d0fe" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="307" y="99" fill="#c4b5fd" font-size="10" letter-spacing="2.3">REAL-TIME SIGNAL</text>
    <text x="893" y="99" text-anchor="end" fill="#8b7ba4" font-size="9">48 kHz / 24-bit</text>
    <text x="307" y="225" fill="#766a83" font-size="8" letter-spacing="1.4">IN</text>
    <text x="893" y="225" text-anchor="end" fill="#766a83" font-size="8" letter-spacing="1.4">OUT</text>
  </g>

  <g class="pulse">
    <circle cx="600" cy="267" r="30" fill="#08060c" stroke="#6d28d9" stroke-width="2"/>
    <circle cx="600" cy="267" r="21" fill="url(#core)" filter="url(#softGlow)"/>
    <circle cx="600" cy="267" r="7" fill="#f5d0fe"/>
  </g>

  <path d="M178 302L198 286H1002L1022 302L1004 331H196Z" fill="#09070d" stroke="#4c3560" stroke-width="2"/>
  <path d="M217 313H453M747 313H983" stroke="#2f223b" stroke-width="7" stroke-linecap="round"/>
  <path d="M217 313H351" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round"/>
  <path d="M747 313H846" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
  <g fill="#f59e0b">
    <circle cx="473" cy="313" r="3"/><circle cx="486" cy="313" r="3" opacity=".45"/><circle cx="714" cy="313" r="3" opacity=".45"/><circle cx="727" cy="313" r="3"/>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="357" rx="18.5" fill="none" stroke="#4c3560" stroke-width="3"/>
  <path d="M23 2H248M952 2H1177M23 358H248M952 358H1177" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>

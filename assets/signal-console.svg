<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">lew0nn signal console</title>
  <desc id="desc">An original dark audio console graphic with cyan and orange signal traces.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11161a"/>
      <stop offset="1" stop-color="#080a0c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d7e0e4" stroke-opacity=".045"/>
    </pattern>
    <filter id="cyan-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orange-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="url(#grid)" stroke="#273038" stroke-width="2"/>

  <g font-family="Consolas, 'Liberation Mono', monospace" letter-spacing="2">
    <text x="48" y="49" fill="#819099" font-size="13">LWN / SIGNAL DESK</text>
    <circle cx="1117" cy="43" r="5" fill="#ff6b35" filter="url(#orange-glow)"/>
    <text x="1133" y="48" fill="#a9b4ba" font-size="11">LIVE</text>
  </g>

  <g transform="translate(48 92)">
    <circle cx="94" cy="94" r="72" fill="none" stroke="#273038" stroke-width="2"/>
    <circle cx="94" cy="94" r="54" fill="none" stroke="#273038" stroke-width="14" stroke-dasharray="7 8"/>
    <path d="M94 30 A64 64 0 0 1 155 113" fill="none" stroke="#ff6b35" stroke-width="4" stroke-linecap="round" filter="url(#orange-glow)"/>
    <line x1="94" y1="94" x2="139" y2="57" stroke="#e7eef1" stroke-width="3" stroke-linecap="round"/>
    <circle cx="94" cy="94" r="9" fill="#0a0d0f" stroke="#e7eef1" stroke-width="3"/>
    <text x="67" y="190" fill="#728087" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="3">DRIVE</text>
  </g>

  <g transform="translate(270 0)">
    <text x="0" y="140" fill="#f2f5f6" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="-4">lew0nn</text>
    <rect x="4" y="165" width="78" height="4" rx="2" fill="#ff6b35"/>
    <text x="4" y="205" fill="#b5c0c5" font-family="Consolas, 'Liberation Mono', monospace" font-size="17" letter-spacing="2">AUDIO SYSTEMS / DSP / INTERFACES</text>
  </g>

  <g transform="translate(270 263)">
    <line x1="0" y1="0" x2="842" y2="0" stroke="#29333a" stroke-width="2"/>
    <path d="M0 0 H48 L60 -10 L72 12 L87 -34 L101 37 L116 -16 L131 9 L146 0 H216
             C232 0 232 -22 248 -22 S264 22 280 22 S296 -22 312 -22 S328 22 344 22
             S360 -22 376 -22 S392 22 408 22 S424 -22 440 -22 S456 22 472 22
             H520 L533 -8 L546 8 L559 -16 L572 16 L585 -8 L598 8 L611 0 H680
             C700 0 700 -32 720 -32 S740 32 760 32 S780 -32 800 -32 S820 32 842 0"
          fill="none" stroke="#43d9d3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyan-glow)"/>
    <g fill="#718087" font-family="Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2">
      <text x="0" y="57">INPUT</text>
      <text x="230" y="57">REACT</text>
      <text x="518" y="57">SHAPE</text>
      <text x="785" y="57">OUTPUT</text>
    </g>
  </g>

  <g transform="translate(1018 112)" font-family="Consolas, 'Liberation Mono', monospace">
    <rect width="116" height="94" rx="8" fill="#11171b" stroke="#2c363c"/>
    <text x="15" y="25" fill="#718087" font-size="10" letter-spacing="2">STATUS</text>
    <text x="15" y="51" fill="#43d9d3" font-size="13" font-weight="700">BUILDING</text>
    <text x="15" y="73" fill="#aab5ba" font-size="11">NOISE → TOOL</text>
  </g>
</svg>

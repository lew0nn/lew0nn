<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="32" viewBox="0 0 1200 32" role="img" aria-label="Animated signal chase divider">
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#481033" stop-opacity="0"/>
      <stop offset=".2" stop-color="#692455"/>
      <stop offset=".55" stop-color="#c090c0"/>
      <stop offset=".85" stop-color="#903060"/>
      <stop offset="1" stop-color="#481033" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .runner { animation: run 8s linear infinite; }
    .mouth { animation: bite .34s ease-in-out infinite alternate; transform-origin: 17px 16px; }
    .dot { animation: shimmer 2.4s ease-in-out infinite; }
    @keyframes run { from { transform: translateX(-40px); } to { transform: translateX(1240px); } }
    @keyframes bite { from { transform: rotate(0deg); } to { transform: rotate(13deg); } }
    @keyframes shimmer { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <path d="M42 16H1158" stroke="url(#trail)" stroke-width="1" opacity=".55"/>
  <g fill="#c090c0">
    <circle class="dot" cx="170" cy="16" r="2.4"/>
    <circle class="dot" cx="250" cy="16" r="2.4" style="animation-delay:-.3s"/>
    <circle class="dot" cx="330" cy="16" r="2.4" style="animation-delay:-.6s"/>
    <circle class="dot" cx="410" cy="16" r="2.4" style="animation-delay:-.9s"/>
    <circle class="dot" cx="490" cy="16" r="2.4" style="animation-delay:-1.2s"/>
    <circle class="dot" cx="570" cy="16" r="2.4" style="animation-delay:-1.5s"/>
    <circle class="dot" cx="650" cy="16" r="2.4" style="animation-delay:-1.8s"/>
    <circle class="dot" cx="730" cy="16" r="2.4" style="animation-delay:-2.1s"/>
    <circle class="dot" cx="810" cy="16" r="2.4" style="animation-delay:-.2s"/>
    <circle class="dot" cx="890" cy="16" r="2.4" style="animation-delay:-.5s"/>
    <circle class="dot" cx="970" cy="16" r="2.4" style="animation-delay:-.8s"/>
    <circle class="dot" cx="1050" cy="16" r="2.4" style="animation-delay:-1.1s"/>
  </g>
  <g class="runner" filter="url(#glow)">
    <path d="M17 4A12 12 0 1 0 17 28A12 12 0 0 0 28 21L17 16L28 11A12 12 0 0 0 17 4Z" fill="#903060"/>
    <path class="mouth" d="M17 16L30 9V23Z" fill="#05030a"/>
    <circle cx="18" cy="9" r="1.7" fill="#e2d7e3"/>
  </g>
</svg>
